<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gym Progress Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
    background:#f3f4f6;
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.stat{
    font-size:2rem;
    color:#2563eb;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border-bottom:1px solid #ddd;
    padding:10px;
    text-align:left;
}

canvas{
    max-height:300px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏋️ Gym Progress Tracker</h1>

<div class="grid">

<div class="card">
<h2>Current Weight</h2>
<div id="currentWeight" class="stat">--</div>
</div>

<div class="card">
<h2>Total Workouts</h2>
<div id="workoutCount" class="stat">0</div>
</div>

</div>

<div class="grid">

<div class="card">
<h2>Log Weight</h2>

<input type="number" id="weightInput" placeholder="Weight in lbs">

<button onclick="saveWeight()">
Save Weight
</button>
</div>

<div class="card">
<h2>Log Workout</h2>

<input id="exercise" placeholder="Exercise">

<input type="number" id="liftWeight" placeholder="Weight">

<input type="number" id="reps" placeholder="Reps">

<input type="number" id="sets" placeholder="Sets">

<button onclick="saveWorkout()">
Save Workout
</button>

</div>

</div>

<div class="card">
<h2>🏆 Personal Record</h2>
<p id="prDisplay">No records yet</p>
</div>

<div class="card">
<h2>📈 Weight Progress</h2>
<canvas id="weightChart"></canvas>
</div>

<div class="card">
<h2>💪 Strength Progress</h2>
<canvas id="strengthChart"></canvas>
</div>

<div class="card">
<h2>Recent Workouts</h2>

<table>
<thead>
<tr>
<th>Date</th>
<th>Exercise</th>
<th>Weight</th>
<th>Reps</th>
<th>Sets</th>
<th>1RM</th>
</tr>
</thead>

<tbody id="workoutTable"></tbody>

</table>

</div>

</div>

<script>

let workouts =
JSON.parse(localStorage.getItem("workouts")) || [];

let weights =
JSON.parse(localStorage.getItem("weights")) || [];

let weightChart;
let strengthChart;

function saveWeight(){

weights.unshift({
date:new Date().toLocaleDateString(),
weight:Number(document.getElementById("weightInput").value)
});

localStorage.setItem(
"weights",
JSON.stringify(weights)
);

document.getElementById("weightInput").value="";

render();

}

function saveWorkout(){

workouts.unshift({

date:new Date().toLocaleDateString(),
exercise:document.getElementById("exercise").value,
weight:Number(document.getElementById("liftWeight").value),
reps:Number(document.getElementById("reps").value),
sets:Number(document.getElementById("sets").value)

});

localStorage.setItem(
"workouts",
JSON.stringify(workouts)
);

document.getElementById("exercise").value="";
document.getElementById("liftWeight").value="";
document.getElementById("reps").value="";
document.getElementById("sets").value="";

render();

}

function calculate1RM(weight,reps){

return Math.round(weight * (1 + reps/30));

}

function renderCharts(){

const weightLabels =
weights.slice().reverse().map(x=>x.date);

const weightData =
weights.slice().reverse().map(x=>x.weight);

if(weightChart){
weightChart.destroy();
}

weightChart=new Chart(
document.getElementById("weightChart"),
{
type:"line",
data:{
labels:weightLabels,
datasets:[{
label:"Body Weight",
data:weightData,
borderColor:"#2563eb",
backgroundColor:"rgba(37,99,235,.2)",
fill:true
}]
}
}
);

const grouped={};

workouts.forEach(w=>{

if(!grouped[w.exercise]){
grouped[w.exercise]=[];
}

grouped[w.exercise].push(w);

});

const colors=[
"#2563eb",
"#16a34a",
"#dc2626",
"#ca8a04",
"#9333ea"
];

const datasets=
Object.keys(grouped)
.slice(0,5)
.map((exercise,index)=>({

label:exercise,

data:grouped[exercise]
.slice()
.reverse()
.map(x=>x.weight),

borderColor:colors[index],

fill:false

}));

if(strengthChart){
strengthChart.destroy();
}

strengthChart=
new Chart(
document.getElementById("strengthChart"),
{
type:"line",
data:{
labels:Array(20).fill(""),
datasets:datasets
}
}
);

}

function render(){

document.getElementById("workoutCount").innerText=
workouts.length;

if(weights.length){

document.getElementById("currentWeight").innerText=
weights[0].weight+" lbs";

}

const table =
document.getElementById("workoutTable");

table.innerHTML="";

workouts.slice(0,20).forEach(w=>{

table.innerHTML+=`
<tr>
<td>${w.date}</td>
<td>${w.exercise}</td>
<td>${w.weight}</td>
<td>${w.reps}</td>
<td>${w.sets}</td>
<td>${calculate1RM(w.weight,w.reps)}</td>
</tr>
`;

});

let best=null;

workouts.forEach(w=>{

const oneRM=
calculate1RM(w.weight,w.reps);

if(!best || oneRM>best.oneRM){

best={
exercise:w.exercise,
oneRM:oneRM
};

}

});

document.getElementById("prDisplay").innerText=
best
? `${best.exercise} - Estimated 1RM ${best.oneRM} lbs`
: "No records yet";

renderCharts();

}

render();

</script>

</body>
</html>
